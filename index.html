    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              file.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
